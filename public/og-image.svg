<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Jainam Shah, Backend Engineer">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0v56" fill="none" stroke="#e8eef4" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#080b0e"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">
    <rect x="80" y="86" width="40" height="40" rx="10" fill="none" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="100" y="107" fill="#34d399" font-size="17" font-weight="700" text-anchor="middle" dominant-baseline="central">JS</text>
    <text x="138" y="107" fill="#99a5b2" font-size="17" dominant-baseline="central">GET /api/jainam</text>
    <text x="1120" y="107" fill="#34d399" font-size="17" text-anchor="end" dominant-baseline="central">200 OK</text>
  </g>

  <text x="80" y="268" fill="#e8eef4" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="94" font-weight="700" letter-spacing="-3">Jainam Shah</text>

  <text x="80" y="340" fill="#34d399" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="30" letter-spacing="-0.5">Backend Engineer · Node.js · Distributed Systems</text>

  <text x="80" y="412" fill="#99a5b2" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26">Queue-backed APIs, idempotent webhook pipelines, and integrations</text>
  <text x="80" y="450" fill="#99a5b2" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="26">that stay correct when traffic spikes.</text>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="22">
    <g>
      <text x="80" y="536" fill="#e8eef4" font-size="34" font-weight="700">250+</text>
      <text x="80" y="566" fill="#7b8795">req/s</text>
    </g>
    <g>
      <text x="260" y="536" fill="#e8eef4" font-size="34" font-weight="700">0</text>
      <text x="260" y="566" fill="#7b8795">oversells</text>
    </g>
    <g>
      <text x="450" y="536" fill="#e8eef4" font-size="34" font-weight="700">6</text>
      <text x="450" y="566" fill="#7b8795">storefronts</text>
    </g>
    <g>
      <text x="680" y="536" fill="#e8eef4" font-size="34" font-weight="700">3+</text>
      <text x="680" y="566" fill="#7b8795">years</text>
    </g>
  </g>

  <rect x="0" y="624" width="1200" height="6" fill="#34d399"/>
</svg>
